<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Science Museum - Home</title>
    <meta name="description" content="Explore the Community Science Museum. Explore hands-on science with fun experiences for kids, teens and families."/>
    <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="page">

<header class="site-header">
    <div class="header-bar">
        <a href="index.html" class="logo">
            <img src="images/ChatGPT-logo.png" alt="Community Science Museum"/>
        </a>
        <button class="nav-toggle" aria-expanded="false" aria-label="Toggle navigation">
            ☰ 
        </button>

        <nav class="main-nav" aria-label="Main navigation">
            <ul class="main-nav_list">
                <li><a class="main-nav__link main-nav__link--active" href="index.html">Home</a></li>
                <li><a class="main-nav__link" href="exhibitions.html">Exhibitions</a></li>
                <li><a class="main-nav__link" href="visit.html">Visit</a></li>
                <li><a class="main-nav__link" href="get-involved.html">Get involved</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <section class="section hero">
        <img class="hero__image"
        src="images/ChatGPT-Hero.jpg"
        alt="Boy and a girl wearing VR headsets, laughing and exploring a science experience"/>

        <div class="hero-card">
            <h1 class="hero-card__title">Start Your Science Adventures</h1>
            <p class="hero-card__text">
                Explore hands-on science with fun experiences for kids, teens and families.
            </p>

        <div class="hero-card__buttons">
            <a class="btn btn--primary" href="visit.html">Explore</a>
            <a class="btn btn--secondary" href="exhibitions.html">Explore Our Museum Exhibitions</a>
        </div>
    </div>
</section>

<section class="audience">
    <div class="audience-grid">
        <article class="audience-card">
            <img src="images/cards/ChatGPT-Kids.jpg" alt="Kid reading a magazine on a pile of books">
        </article>

        <article class="audience-card">
            <img src="images/cards/ChatGPT-Teachers.jpg" alt="Teacher at the museum">
        </article>

        <article class="audience-card">
            <img src="images/cards/ChatGPT-Researchers.jpg" alt="Researcher at the museum">
        </article>
    </div>
    </section>

    <section class="section section-line" aria-hidden="true">
        <img class="section-line__image" src="images/noroff-img/lab-512503_1920.jpg" alt="Vintage illustration of a laboratory with classic scientific intruments"/>
    </section>

    <section class="section section--dark section-events" aria-labelledby="events-title">
        <h2 id="events-title" class="section-title section-title--light">Special Events And Exhibitions</h2>


        

        <div class="events-grid">
        <article class="card card--dark">
            <img class="card__image" src="images/cards/ChatGPT-Aeronautics.jpg" alt="show the development of aeronautics and where the future lies in this exciting space"/>
            <div class="card__body">

            </div>
        </article>
        
        <article class="card card--dark">
            <img class="card__image" src="images/cards/ChatGPT-Night-at.jpg" alt="Boy in pajamas holding a pillow looking up at a mammoth skeleton in the museum."/>
            <div class="card__body">
                <h3 class="card__title">Night in the Museum</h3>
            </div>
        </article>

        <article class="card card--dark">
            <img class="card__image" src="images/cards/ChatGPT-Energetica.jpg" alt="Energetica consists of installations that allow visitors to experience the power of the elements as we harness them."/>
            <div class="card__body">
                <h3 class="card__title">Energetica Exhibition on Loan</h3>
            </div>
        </article> 

        </div>
    </section>

    

</main>

</html>
